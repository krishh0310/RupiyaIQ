name: rupiya_iq
description: "RupiyaIQ — snap a bill, AI extracts, categorises and explains your spending."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  # Deprecated but stable — kept intentionally for hackathon. Post-hackathon migration path: firebase_ai (Firebase AI Logic).
  google_generative_ai: ^0.4.7
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  fl_chart: ^1.2.0
  intl: ^0.20.3
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  permission_handler: ^13.0.2
  speech_to_text: ^7.5.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/test_receipt.jpg
